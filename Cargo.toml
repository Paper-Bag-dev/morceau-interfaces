[package]
name = "morceau"
version = "0.1.0"
edition = "2021"
description = "Morceau: a local host that shows borderless, transparent, self-expiring UI windows driven by an AI agent through a CLI"

[[bin]]
name = "morc"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_Debug",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
