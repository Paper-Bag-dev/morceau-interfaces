[package]
name = "morceau"
version = "0.1.0"
edition = "2021"
description = "Morceau: a local host that shows borderless, transparent, self-expiring UI windows driven by an AI agent through a CLI"

[[bin]]
name = "morc"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows only: the Win32 API behind src/platform/ and the cfg(windows) blocks elsewhere.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_Debug",
]

# macOS only (see "macOS port" in AGENTS.md). objc2 talks to AppKit (NSWindow, NSScreen, NSWorkspace); CoreGraphics and libdispatch are
# called through small extern blocks in src/platform/macos/sys.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# WKPreferences: let the hidden root page open the (linked) cards by script (platform/macos/app.rs).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
global-hotkey = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
